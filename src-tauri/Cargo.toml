[package]
name = "bachelor-re"
version = "0.1.0"
description = "Bachelor:Re — OpenBachelor launcher (S/C) desktop shell"
authors = ["Bachelor:Re"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "bachelor_re_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
